<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITY EXPLORER</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
  font-family: sans-serif;
  background-color: rgb(208, 207, 207);
}

nav {
  align-content: center;
  justify-items: center;
  height: 4rem;
  background-color: #48484A;
  width: 100%;
}

nav h2{
    color: white;
    background-color: #48484A;
}

.gallery {
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 40px;
  padding: 50px;
  height: 35.4rem;
}

.sidebar {
  display: grid;
  grid-template-columns: repeat(2, 150px);
  grid-gap: 15px;
  margin-top: 6rem;
}

.sidebar img{
    height: 120px;
}

.sidebar h4{
    align-items: center;
    justify-content: center;
    justify-self: center;
    color: #48484A;
}

.thumbnail {
  width: 150px;
  height: 100px;
  object-fit: cover;
  cursor: pointer;
  border-radius: 8px;
  transition:
    transform 0.2s,
    border 0.2s;
  border: 3px solid transparent;

}

.thumbnail:hover {
  transform: scale(1.05);
  border-color: black;
}

.display-area {
  width: 650px;
  height: 400px;
  border: 2px dashed black;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: rgb(191, 189, 189);
  overflow: hidden;
  margin-top: 2.5rem;
  margin-left: 7rem;
}

#featured-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none; 
}

.placeholder-text {
  color: black;
  background-color: rgb(191, 189, 189);
}

    </style> 
</head>
<body>
    <nav>
        <h2>CITY EXPLORER</h2>
    </nav>

    <div class="gallery">
    <div class="sidebar">
        <div class="first-pic">
           <img src="https://media-cdn.tripadvisor.com/media/attractions-splice-spp-674x446/0a/c6/d5/48.jpg" 
           alt="Islamabad" class="thumbnail" onmouseover="showImage(this.src)"> 
             <h4>Karachi</h4>
        </div>
        
        <div class="second-pic">
           <img src="https://images.trvl-media.com/place/1809/4ab094ad-ff37-4b5e-b24c-859d5ecc5128.jpg" 
           alt="Karachi" class="thumbnail" onmouseover="showImage(this.src)"> 
             <h4>Karachi</h4>
        </div>
        
        <div class="third-pic">
           <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Eye_Of_Lahore_%28Minar_e_Pakistan%29_evening.jpg/1280px-Eye_Of_Lahore_%28Minar_e_Pakistan%29_evening.jpg" 
           alt="Lahore" class="thumbnail" onmouseover="showImage(this.src)"> 
             <h4>Karachi</h4>
        </div>

        <div class="fourth-pic">
           <img src="https://pakistanptpc.com/wp-content/uploads/2025/08/Places-to-visit-in-Peshawar-04-1.jpg" 
           alt="Peshawar" class="thumbnail" onmouseover="showImage(this.src)"> 
             <h4>Karachi</h4>
        </div>
        
        
    </div>

    <div class="display-area" id="display-container">
        <span class="placeholder-text">Hover over a city to view</span>
        <img id="featured-image" src="" alt="Featured City">
    </div>
    </div>

    
    <script>
        function showImage(imageSrc) {
            const featured = document.getElementById('featured-image');
            const placeholder = document.querySelector('.placeholder-text');
            
            featured.src = imageSrc;

            featured.style.display = 'block';
            placeholder.style.display = 'none';
        }
    </script>

</body>
</html>
